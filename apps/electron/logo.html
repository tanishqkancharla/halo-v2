<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Halo logo preview</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #141414;
        color: #e8e8e8;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      body {
        display: grid;
        place-items: center;
      }
      canvas {
        display: block;
        width: min(80vmin, 720px);
        height: min(80vmin, 720px);
      }
    </style>
  </head>
  <body>
    <canvas
      width="720"
      height="720"
      role="img"
      aria-label="Halo"
      data-testid="halo-logo"
    ></canvas>
    <script type="module" src="/src/renderer/logoPreview.ts"></script>
  </body>
</html>
