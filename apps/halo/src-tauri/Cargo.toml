[package]
name = "halo"
version = "0.1.0"
description = "Halo desktop app"
authors = ["Saffron Health"]
edition = "2021"

[lib]
name = "halo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agentos-client = "=0.2.15"
agentos-vm-config = "=0.2.15"
dotenvy = "=0.15.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-wdio-webdriver = "1"
tokio = { version = "1", features = ["sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
